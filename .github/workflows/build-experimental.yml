  macos1012-1014:
    name: build for macOS 10.12-10.14
    runs-on: macos-26
    if: ${{ !endsWith(github.event.head_commit.message, 'DONTBUILD') && !contains(github.event.head_commit.message, 'IGNORE10121014') && contains(github.event.head_commit.message, 'BUILDNIGHTLY') }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
